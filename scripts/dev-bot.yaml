# Dev-bot patch layer, applied by scripts/run-dev-bot.sh as
# `dsh --profile dev-bot --patch scripts/dev-bot.yaml` — the same document
# shape as any profile cordis.patch.yml, composed over the web-identical
# bundle stack (dsh-base + dsh-web-app). Edit this file, restart the script.
#
# Secrets never go here: `dsh credentials set TELEGRAM_BOT_TOKEN ...` or the
# TELEGRAM_BOT_TOKEN environment variable.

- insert:
    - id: channel
      name: dsh-channel
- insert:
    - id: channel-telegram
      name: dsh-channel-telegram
      config:
        allowedUserIds: [5002186681]   # ← your Telegram user id
        provider: deepseek-official
        model: deepseek-v4-flash
        # Dev state stays apart from any other profile sharing this DSH_HOME.
        statePath: !!js dshHomePath('dev-bot', 'channel-telegram', 'state.json')
        # cwd / agentPreset unset: process.cwd() workspace (the script stands in
        # agent-workspace/) + the host default preset (standard).
        # pollingTimeoutSec: 30
        # mergeWindowSec: 5
        # approvalTimeoutSec: 120
        # accountId: dev               # second bot of the same platform
        # proxyUrl: http://127.0.0.1:7890
