# dsh-channel-telegram wiring example (already configured with your user_id).
# Note: if the host harness already loads dsh-channel (registry core) or it is auto-loaded by a bundle, delete the first insert below.
- insert:
    - id: channel
      name: dsh-channel
- insert:
    - id: channel-telegram
      name: dsh-channel-telegram
      config:
        allowedUserIds: [5002186681]
        provider: deepseek-official
        model: deepseek-v4-flash
        # cwd unset = use the host process.cwd() (the project directory where you start dsh),
        # the same workspace as Web sessions; don't point at a fresh empty ~/agent-workspace directory like the old example did.
        # agentPreset unset = auto-join the host default preset (dsh-agent-presets's defaultId,
        # `standard` for a standard web deployment), keeping the full stock tool/persona/skills capabilities.
        # Only override explicitly when you want a separate tool set for Telegram: agentPreset: minimal
# The token is not in this file: use dsh credentials set TELEGRAM_BOT_TOKEN or the TELEGRAM_BOT_TOKEN environment variable.
