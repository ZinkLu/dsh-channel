# dsh-session-manager wiring example.
# The manager is channel-agnostic: it registers ctx.sessionManager, the global
# notify_user tool, and the session/task/outbox tables. Channel providers pick
# it up automatically through ctx.get('sessionManager') — no provider config
# changes are needed. Install it BEFORE the channel rows so the bridge sees it
# from its first start().
- insert:
    - id: session-manager
      name: dsh-session-manager
      config:
        # defaultSubscribers: subscriberKeys that receive `notify`/`error` for
        # sessions with no watcher of their own (e.g. a browser-opened session
        # calling notify_user). Channel convention: channel:<id>[:<account>]:<chatKey>.
        # defaultSubscribers:
        #   - channel:telegram:5002186681
        # statePath unset = $DSH_HOME/session-manager/state.json (JSON fallback
        # store; used only when ctx.storageDomain is absent).
        # provider / model / cwd / agentPreset: creation defaults for sessions
        # this manager creates; a channel bridge passes its own config through
        # create()/dispatch() and wins over these.
        #
        # Concierge (design §15): a natural-language session-control agent on
        # the well-known `manager:concierge` session — reach it with
        # `/bind manager:concierge`, then talk to it in free text. It drives
        # this same manager through 8 tools; dispatched tasks re-awaken it to
        # verify and report. enable writes one store row at start; the agent
        # spawns lazily on first touch.
        # concierge:
        #   enable: true
        #   label: concierge      # /ls label (default "concierge")
        #   # agentPreset: standard
        #   # cwd: /home/me/projects   # its own workspace (default: manager cwd)
        #   # instructions: |         # system-prompt section (default: built-in text)
        #   #   You are my session concierge...
