# dsh-channel-wechat 装配示例（微信 iLink Bot API）。
# 注意：若宿主 harness 已加载 dsh-channel（注册表核心）或已由 bundle 自动加载，删除下面第一条 insert 即可。
- insert:
    - id: channel
      name: dsh-channel
- insert:
    - id: channel-wechat
      name: dsh-channel-wechat
      config:
        allowedUserIds: []           # 微信侧 user id（iLink bot 收到私聊后从日志读 from_user_id 再填）
        provider: deepseek-official
        model: deepseek-v4-flash
        # accountId 建议走凭据：dsh credentials set WECHAT_ACCOUNT_ID ...
        # token 不在此文件：dsh credentials set WECHAT_TOKEN 或环境变量 WECHAT_TOKEN。
        # cwd / agentPreset 不设 = 沿用宿主 process.cwd() + 宿主默认 preset。
