# dsh-channel-feishu wiring example (Feishu / Lark, long-connection mode, no public address required).
# Note: if the host harness already loads dsh-channel (the registry core) or a bundle loads it automatically, delete the first insert below.
- insert:
    - id: channel
      name: dsh-channel
- insert:
    - id: channel-feishu
      name: dsh-channel-feishu
      config:
        allowedUserIds: []           # Feishu user open_id (starting with ou_); after receiving a DM, read the open_id from logs and fill it in
        provider: deepseek-official
        model: deepseek-v4-flash
        # domain unset = feishu; set domain: lark for Lark international
        # cwd / agentPreset unset = inherit the host process.cwd() + host default preset.
# Credentials are not in this file: dsh credentials set FEISHU_APP_ID / FEISHU_APP_SECRET (or environment variables).
